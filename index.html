<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>In Loving Memory</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
    }

    /* =========================
       FULL SCREEN GIF
    ========================= */

    .background-gif {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center center;

      z-index: 1;
    }

    /* =========================
       DARK OVERLAY
    ========================= */

    .overlay {
      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, 0.25);

      z-index: 2;

      pointer-events: none;
    }

    /* =========================
       CONTENT
    ========================= */

    .cover {
      position: relative;

      width: 100%;
      height: 100vh;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      z-index: 3;

      opacity: 0;

      animation: fadeIn 1.5s ease forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       INVITATION CARD
    ========================= */

    .card {
      width: min(90vw, 650px);

      padding: 50px 40px;

      text-align: center;

      color: white;

      background: rgba(0, 0, 0, 0.38);

      border: 1px solid rgba(255, 255, 255, 0.75);

      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);

      backdrop-filter: blur(5px);

      -webkit-backdrop-filter: blur(5px);

      animation: cardIn 1.8s ease forwards;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: scale(0.94);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* =========================
       TEXT
    ========================= */

    .invited {
      font-family: Arial, sans-serif;

      font-size: 14px;

      font-weight: 600;

      letter-spacing: 5px;

      margin-bottom: 22px;
    }

    .gold-line {
      width: 110px;

      height: 1px;

      background: white;

      margin: 0 auto 25px;
    }

    .memory {
      font-family: Arial, sans-serif;

      font-size: 11px;

      letter-spacing: 4px;

      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(28px, 5vw, 46px);

      font-weight: 400;

      line-height: 1.2;

      text-shadow: 0 3px 15px rgba(0, 0, 0, 0.8);
    }

    .heart {
      font-size: 32px;

      margin: 15px 0;

      animation: heartbeat 2.5s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.12);
      }
    }

    h2 {
      font-size: clamp(24px, 4vw, 38px);

      font-weight: 400;

      line-height: 1.25;

      margin-bottom: 25px;

      text-shadow: 0 3px 15px rgba(0, 0, 0, 0.8);
    }

    .date {
      font-family: Arial, sans-serif;

      font-size: 13px;

      letter-spacing: 3px;

      margin-top: 25px;
    }

    .time {
      font-size: 22px;

      margin-top: 8px;

      margin-bottom: 30px;
    }

    /* =========================
       VIEW INVITATION BUTTON
    ========================= */

    .view-invitation {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 15px;

      padding: 15px 30px;

      color: white;

      background: rgba(0, 0, 0, 0.4);

      border: 1px solid white;

      text-decoration: none;

      font-family: Arial, sans-serif;

      font-size: 11px;

      font-weight: 600;

      letter-spacing: 4px;

      transition: all 0.4s ease;

      cursor: pointer;
    }

    .view-invitation span {
      font-size: 20px;

      transition: transform 0.3s ease;
    }

    .view-invitation:hover {
      background: white;

      color: black;

      transform: translateY(-4px);

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .view-invitation:hover span {
      transform: translateX(7px);
    }

    /* =========================
       MUSIC BUTTON
    ========================= */

    .music-button {
      position: fixed;

      top: 25px;
      right: 25px;

      width: 55px;
      height: 55px;

      border-radius: 50%;

      border: 1px solid white;

      background: rgba(0, 0, 0, 0.5);

      color: white;

      font-size: 21px;

      cursor: pointer;

      z-index: 10;

      display: flex;

      align-items: center;
      justify-content: center;

      transition: 0.3s ease;
    }

    .music-button:hover {
      background: white;

      color: black;

      transform: scale(1.08);
    }

    .music-button.playing {
      animation: musicPulse 1.5s infinite;
    }

    @keyframes musicPulse {
      0% {
        box-shadow: 0 0 0 rgba(255,255,255,0);
      }

      50% {
        box-shadow: 0 0 25px rgba(255,255,255,0.8);
      }

      100% {
        box-shadow: 0 0 0 rgba(255,255,255,0);
      }
    }

    /* =========================
       PHONE
    ========================= */

    @media (max-width: 600px) {

      .cover {
        padding: 15px;
      }

      .card {
        width: 94vw;

        padding: 35px 18px;
      }

      .invited {
        font-size: 9px;

        letter-spacing: 3px;
      }

      .memory {
        font-size: 8px;

        letter-spacing: 2.5px;
      }

      h1 {
        font-size: 27px;
      }

      h2 {
        font-size: 23px;
      }

      .date {
        font-size: 9px;

        letter-spacing: 2px;
      }

      .time {
        font-size: 19px;
      }

      .view-invitation {
        padding: 13px 22px;

        font-size: 9px;

        letter-spacing: 3px;
      }

      .music-button {
        width: 45px;
        height: 45px;

        top: 15px;
        right: 15px;

        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <!-- =================================
       YOUR GIF
  ================================== -->

  <img
    src="memorial-flyer gif.gif"
    class="background-gif"
    alt=""
  >

  <div class="overlay"></div>


  <!-- =================================
       MUSIC BUTTON
  ================================== -->

  <button
    class="music-button"
    id="musicBtn"
    type="button"
  >
    🎵
  </button>


  <!-- =================================
       FIRST PAGE
  ================================== -->

  <main class="cover">

    <div class="card">

      <p class="invited">
        YOU ARE CORDIALLY INVITED
      </p>

      <div class="gold-line"></div>

      <p class="memory">
        IN LOVING MEMORY OF
      </p>

      <h1>
        Late Wilhelmina Akua<br>
        Ampofoa Yirenkyi
      </h1>

      <div class="heart">
        ♡
      </div>

      <h2>
        Late Christian Saampah<br>
        Yirenkyi
      </h2>

      <div class="gold-line"></div>

      <p class="date">
        SUNDAY · 4TH OCTOBER · 2026
      </p>

      <p class="time">
        1:00 PM
      </p>

      <!-- GOES TO SECOND PAGE -->
      <a
        href="invitation.html"
        class="view-invitation"
      >
        VIEW INVITATION
        <span>→</span>
      </a>

    </div>

  </main>


  <!-- =================================
       MUSIC
  ================================== -->

  <audio
    id="weddingMusic"
    src="memorial-music.mp3"
    loop
    preload="auto"
  ></audio>


  <!-- =================================
       JAVASCRIPT
  ================================== -->

 <script>
  const music = document.getElementById("weddingMusic");
  const musicBtn = document.getElementById("musicBtn");

  let playing = false;
  let wasPlayingBeforeHidden = false;

  /* =========================
     UPDATE MUSIC BUTTON
  ========================= */

  function updateMusicButton() {
    if (playing) {
  musicBtn.textContent = "🔊";
  musicBtn.classList.add("playing");
} else {
  musicBtn.textContent = "🔇";
  musicBtn.classList.remove("playing");
}
  }


  /* =========================
     START MUSIC
  ========================= */

  function startMusic() {

    music.play()
      .then(function () {

        playing = true;

        // Remember that the visitor was listening
        localStorage.setItem("memorialMusicPlaying", "true");

        updateMusicButton();

      })
      .catch(function (error) {

        console.log("Music could not start:", error);

      });

  }


  /* =========================
     PAUSE MUSIC
  ========================= */

  function pauseMusic() {

    music.pause();

    playing = false;

    localStorage.setItem("memorialMusicPlaying", "false");

    updateMusicButton();

  }


  /* =========================
     TOGGLE MUSIC BUTTON
  ========================= */

  musicBtn.addEventListener("click", function (event) {

    // Prevent the document click event from firing
    event.stopPropagation();

    if (playing) {

      pauseMusic();

    } else {

      startMusic();

    }

  });


  /* =========================
     CLICK / TOUCH ANYWHERE
     TO START MUSIC
  ========================= */

  document.addEventListener("click", function (event) {

    // Don't trigger twice when music button is clicked
    if (event.target.closest("#musicBtn")) {
      return;
    }

    if (!playing) {
      startMusic();
    }

  });


  document.addEventListener("touchstart", function (event) {

    // Don't trigger twice when music button is touched
    if (event.target.closest("#musicBtn")) {
      return;
    }

    if (!playing) {
      startMusic();
    }

  }, { passive: true });


  /* =========================
     PAUSE WHEN LEAVING PAGE
  ========================= */

  document.addEventListener("visibilitychange", function () {

    if (document.hidden) {

      // Remember whether music was playing
      wasPlayingBeforeHidden = playing;

      if (playing) {

        music.pause();

        playing = false;

        updateMusicButton();

      }

    } else {

      // Page has become visible again

      if (wasPlayingBeforeHidden) {

        startMusic();

      }

    }

  });


  /* =========================
     REMEMBER MUSIC STATE
  ========================= */

  window.addEventListener("beforeunload", function () {

    if (playing) {

      localStorage.setItem("memorialMusicPlaying", "true");

    } else {

      localStorage.setItem("memorialMusicPlaying", "false");

    }

  });


  /* =========================
     INITIAL ICON STATE
  ========================= */

  updateMusicButton();


  /* =========================
     RESTORE MUSIC AFTER
     PAGE IS OPENED AGAIN
  ========================= */

  const savedMusicState =
    localStorage.getItem("memorialMusicPlaying");

  if (savedMusicState === "true") {

    // Browsers normally block automatic audio.
    // The next click/touch will start the music.
    musicBtn.textContent = "🎵";

  }

</script>

</body>
</html>
